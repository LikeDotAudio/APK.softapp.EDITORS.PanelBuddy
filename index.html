<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Buddy & Scribble Strip Editor · Standalone Block Editor</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="./css/theme.css">
  <style>
    .panel-container {
      display: grid;
      grid-template-columns: 360px 1fr;
      grid-template-rows: 1fr 240px;
      height: calc(100vh - 40px);
      overflow: hidden;
    }

    .panel-sidebar {
      grid-column: 1;
      grid-row: 1;
      border-right: 1px solid var(--osc-border-default);
      background: var(--osc-bg-surface);
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 14px;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 600;
      color: var(--osc-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .preview-panel {
      grid-column: 2;
      grid-row: 1;
      background: var(--osc-bg-base);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .preview-header {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--osc-border-default);
      background: var(--osc-bg-surface);
    }

    .preview-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: auto;
      background: radial-gradient(circle at 50% 50%, #1e1e24 0%, #121212 100%);
    }

    .preview-stage svg {
      max-width: 95%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      border-radius: 4px;
    }

    .ruler-wrap {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .ruler {
      position: relative;
      width: 254px; /* exactly 10 inches at 25.4px/in or 100mm scaled */
      height: 14px;
      background: var(--osc-bg-input);
      border: 1px solid var(--osc-border-default);
      border-radius: 2px;
    }

    .tick {
      position: absolute;
      top: 0;
      width: 1px;
      height: 6px;
      background: var(--osc-border-light);
    }

    .tick.major {
      height: 12px;
      background: var(--osc-accent-primary);
    }

    .ruler-cap {
      font-size: 10px;
      color: var(--osc-text-muted);
      margin-top: 4px;
      font-family: var(--font-mono);
    }

    .data-grid-panel {
      grid-column: 1 / 3;
      grid-row: 2;
      border-top: 1px solid var(--osc-border-default);
      background: var(--osc-bg-surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .data-grid-header {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--osc-border-default);
      background: var(--osc-bg-surface-hover);
    }

    .data-table-container {
      flex: 1;
      overflow: auto;
    }

    table.port-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    table.port-table th {
      position: sticky;
      top: 0;
      background: var(--osc-bg-input);
      color: var(--osc-text-muted);
      padding: 6px 8px;
      text-align: left;
      border-bottom: 1px solid var(--osc-border-default);
      font-weight: 600;
      z-index: 2;
    }

    table.port-table td {
      padding: 2px 4px;
      border-bottom: 1px solid var(--osc-border-default);
    }

    .cell-input {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--osc-text-primary);
      padding: 4px 6px;
      font-size: 11px;
      border-radius: 2px;
      font-family: inherit;
    }

    .cell-input:focus {
      background: var(--osc-bg-input);
      border-color: var(--osc-accent-primary);
      outline: none;
    }

    .text-center {
      text-align: center;
    }

    .col-idx {
      width: 50px;
    }

    .col-actions {
      width: 45px;
      text-align: center;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      .preview-stage, .preview-stage * {
        visibility: visible;
      }
      .preview-stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: white;
      }
    }
  </style>
</head>
<body class="theme-deep-horizon">
  <header class="app-window-header">
    <div class="window-title-group">
      <span class="window-dot"></span>
      <span class="window-title">Panel Label Buddy</span>
      <span class="window-pill" id="block-tag">STANDALONE BLOCK EDITOR</span>
    </div>
    <div class="window-actions">
      <button class="btn btn-secondary" id="btn-sync-discovered" title="Load live panel from Discovered Project">
        <span class="btn-icon">⚡</span> Discovered
      </button>
      <button class="btn btn-secondary" id="btn-open" title="Open block JSON">
        <span class="btn-icon">📂</span> Open
      </button>
      <button class="btn btn-primary" id="btn-save" title="Save & Return modified block to caller">
        <span class="btn-icon">💾</span> Save & Return
      </button>
      <button class="btn btn-icon" id="btn-close" title="Close Editor">✕</button>
    </div>
  </header>

  <div class="panel-container">
    <aside class="panel-sidebar">
      <div class="form-group">
        <label for="input-panel-name">Panel Name / Tag</label>
        <input type="text" id="input-panel-name" class="input" value="PP-AUDIO-01">
      </div>

      <div class="form-group">
        <label for="input-panel-room">Location / Room Path</label>
        <input type="text" id="input-panel-room" class="input" value="MDF / RACK-01">
      </div>

      <div class="form-group">
        <label>Ports Per Row</label>
        <div class="chip-bar" id="chips-ppr"></div>
      </div>

      <div class="form-group">
        <label>Rack Units (RU)</label>
        <div class="chip-bar" id="chips-ru"></div>
      </div>

      <div class="form-group">
        <label>Scribble Strip Style</label>
        <div class="chip-bar" id="chips-mode">
          <div class="chip active" data-mode="inserts">Paper Inserts (0.39″)</div>
          <div class="chip" data-mode="etched">Laser Etched (0.50″)</div>
        </div>
      </div>

      <div class="form-group">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" id="chk-bay">
          <span>48-Point Video Bay (Mid-Split Pitch)</span>
        </label>
      </div>

      <div style="background:var(--osc-bg-input); border:1px solid var(--osc-border-default); border-radius:4px; padding:10px; margin-top:auto;">
        <div style="font-size:10px; font-weight:700; color:var(--osc-accent-primary); text-transform:uppercase; margin-bottom:4px;">Geometry Readout</div>
        <div id="geometry-summary" style="font-size:11px; font-family:var(--font-mono); color:var(--osc-text-muted); line-height:1.4;">
          24-port · 1U · cell 0.73″ × 0.39″ · 1:1
        </div>
      </div>
    </aside>

    <main class="preview-panel">
      <div class="preview-header">
        <span style="font-size:12px; font-weight:600; color:var(--osc-text-primary);">
          Physical Strip Preview (1:1 Calibrated Scale)
        </span>
        <button class="btn btn-primary btn-sm" id="btn-print">
          <span class="btn-icon">🖨</span> Print 1:1 Scale
        </button>
      </div>
      <div class="preview-stage" id="preview-stage"></div>
    </main>

    <section class="data-grid-panel">
      <div class="data-grid-header">
        <span style="font-size:11px; font-weight:600; text-transform:uppercase; color:var(--osc-text-muted);">
          Panel Port List (Live Editable)
        </span>
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="btn btn-secondary btn-sm" id="btn-generate-ports">Fill Grid to Density</button>
          <button class="btn btn-secondary btn-sm" id="btn-export-csv">Export CSV</button>
          <button class="btn btn-primary btn-sm" id="btn-add-port">+ Add Port</button>
        </div>
      </div>
      <div class="data-table-container">
        <table class="port-table">
          <thead>
            <tr>
              <th class="col-idx">Port #</th>
              <th>Port Label</th>
              <th>Destination / Endpoint</th>
              <th>Signal Type</th>
              <th>Connector</th>
              <th class="col-actions">Act</th>
            </tr>
          </thead>
          <tbody id="port-table-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script type="module" src="./js/panelBuddyApp.js"></script>
</body>
</html>
